# Il piano gratuito di Supabase mette in pausa il progetto dopo 7 giorni senza
# attività. Se Rossi non apre l'app per una settimana, al rientro trova il
# database spento e l'app non risponde finché non lo risveglia a mano dalla
# dashboard.
#
# Questo workflow fa una query banale ogni 3 giorni: abbastanza spesso da non
# arrivare mai vicino ai 7 giorni, anche se un'esecuzione fallisce.
#
# Costo: zero. Le GitHub Actions sui repository pubblici sono gratuite e questo
# job dura pochi secondi. Non tocca Netlify e non genera nessun deploy.
#
# SERVE UNA COSA SOLA, una volta: aggiungere il segreto SUPABASE_ANON_KEY in
# Settings -> Secrets and variables -> Actions. È la stessa chiave pubblica già
# presente nelle variabili d'ambiente di Netlify. Senza, il job fallisce con un
# messaggio esplicito invece di far finta di funzionare.

name: Keep Supabase Alive

on:
  schedule:
    # ogni 3 giorni alle 06:00 UTC
    - cron: "0 6 */3 * *"
  workflow_dispatch: # avviabile anche a mano dalla tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping del database Supabase
        env:
          SUPABASE_URL: https://zjucgmngettxfwgxazxl.supabase.co
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::Manca il segreto SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

          # Una lettura minima: una sola riga, una sola colonna. Basta a contare
          # come attività e a tenere il progetto sveglio.
          CODE=$(curl -s -o /tmp/risposta.txt -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/settings?select=key&limit=1")

          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Il database non ha risposto correttamente."
            cat /tmp/risposta.txt
            exit 1
          fi
          echo "Database sveglio."
